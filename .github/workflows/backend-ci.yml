name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DB_NAME: recruitment_app
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v5

      - name: Instalacja Pythona 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Sprawdzenie formatowania
        run: ruff format --check .

      - name: Sprawdzenie projektu
        run: python manage.py check

      - name: Sprawdzenie, czy nie brakuje migracji
        run: python manage.py makemigrations --check --dry-run

      - name: Uruchomienie migracji
        run: python manage.py migrate

  migrate-production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: migrate-production

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v5

      - name: Instalacja Pythona 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Migracje na bazie produkcyjnej
        run: python manage.py migrate --noinput
